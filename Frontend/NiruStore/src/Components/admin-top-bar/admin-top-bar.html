<header
  class="h-20
         flex-shrink-0
         bg-white
         border-b
         border-gray-200
         flex
         items-center
         justify-between
         px-5
         sm:px-8
         "
         
>

  <!-- ============================================ -->
  <!-- LEFT -->
  <!-- ============================================ -->

  <div
    class="flex
           items-center"
  >

    <!-- MOBILE MENU -->

    <button
      type="button"
      (click)="openMenu()"

      class="lg:hidden
             w-10
             h-10
             rounded-lg
             bg-gray-100
             flex
             items-center
             justify-center
             hover:bg-gray-200
             transition"
    >

      <svg
        class="w-6 h-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />

      </svg>

    </button>


    <!-- TITLE -->

    <div
      class="ml-3
             lg:ml-0"
    >

      <h2
        class="text-xl
               sm:text-2xl
               font-semibold"
      >
        Dashboard
      </h2>

      <p
        class="hidden
               sm:block
               text-xs
               text-gray-400
               mt-0.5"
      >
        Welcome back, Admin
      </p>

    </div>

  </div>


  <!-- ============================================ -->
  <!-- RIGHT -->
  <!-- ============================================ -->

  <div
    class="flex
           items-center
           gap-3
           sm:gap-5"
  >

    <!-- NOTIFICATION -->

    <button
      type="button"

      class="relative
             w-10
             h-10
             rounded-full
             hover:bg-gray-100
             flex
             items-center
             justify-center
             transition"
    >

      <svg
        class="w-5 h-5 text-gray-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
          d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9
             M13.73 21a2 2 0 0 1-3.46 0"
        />

      </svg>


      <span
        class="absolute
               top-2
               right-2
               w-2
               h-2
               rounded-full
               bg-red-500"
      ></span>

    </button>


    <!-- PROFILE -->

    <div
      class="flex
             items-center
             gap-3"
    >

      <div
        class="hidden
               sm:flex
               w-10
               h-10
               rounded-full
               bg-[#111111]
               text-[#c89b3c]
               items-center
               justify-center
               font-semibold"
      >
        A
      </div>


      <div
        class="hidden
               md:block"
      >

        <p
          class="text-sm
                 font-semibold"
        >
          Admin
        </p>

        <p
          class="text-xs
                 text-gray-400"
        >
          Administrator
        </p>

      </div>

    </div>

  </div>

</header>
