
<div class="min-h-screen bg-[#0b0b0b] flex items-center justify-center px-4 py-12">

  <div class="w-full max-w-md rounded-2xl border border-gray-800 bg-[#141414] p-6 sm:p-8 shadow-2xl">

    <!-- Logo / Heading -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold tracking-wide text-[#d4af37]">
        NiruStore
      </h1>

      <h2 class="mt-5 text-2xl font-semibold text-white">
        Reset Password
      </h2>

      <p class="mt-2 text-sm text-gray-400">
        Enter your new password below.
      </p>
    </div>

    <!-- Error Message -->
    <div
      *ngIf="errorMessage"
      class="mb-5 rounded-lg border border-red-800 bg-red-950/40 p-3 text-sm text-red-300"
      role="alert"
    >
      {{ errorMessage }}
    </div>

    <!-- Success Message -->
    <div
      *ngIf="successMessage"
      class="mb-5 rounded-lg border border-green-800 bg-green-950/40 p-3 text-sm text-green-300"
      role="status"
    >
      {{ successMessage }}
    </div>

    <form
      *ngIf="token"
      (ngSubmit)="resetPassword()"
      #resetForm="ngForm"
      class="space-y-5"
    >

      <!-- New Password -->
      <div>
        <label
          for="newPassword"
          class="mb-2 block text-sm font-medium text-gray-300"
        >
          New Password
        </label>

        <div class="relative">
          <input
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Enter new password"
            autocomplete="new-password"
            required
            minlength="8"
            class="w-full rounded-lg border border-gray-700 bg-[#0b0b0b] px-4 py-3 pr-16 text-white outline-none transition focus:border-[#d4af37]"
          />

          <button
            type="button"
            (click)="showPassword = !showPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-[#d4af37]"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>

        <p class="mt-2 text-xs text-gray-500">
          Use at least 8 characters.
        </p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label
          for="confirmPassword"
          class="mb-2 block text-sm font-medium text-gray-300"
        >
          Confirm New Password
        </label>

        <div class="relative">
          <input
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirm new password"
            autocomplete="new-password"
            required
            class="w-full rounded-lg border border-gray-700 bg-[#0b0b0b] px-4 py-3 pr-16 text-white outline-none transition focus:border-[#d4af37]"
          />

          <button
            type="button"
            (click)="showConfirmPassword = !showConfirmPassword"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-[#d4af37]"
          >
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="loading || !resetForm.valid"
        class="w-full rounded-lg bg-[#d4af37] px-4 py-3 font-semibold text-black transition hover:bg-[#b8962e] disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ loading ? 'Resetting Password...' : 'Reset Password' }}
      </button>

    </form>

    <!-- Login Link -->
    <div class="mt-7 text-center">
      <a
        routerLink="/login"
        class="text-sm text-gray-400 transition hover:text-[#d4af37]"
      >
        Back to Login
      </a>
    </div>

  </div>
</div>
