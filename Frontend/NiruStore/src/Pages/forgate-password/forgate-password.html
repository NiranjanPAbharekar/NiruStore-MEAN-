<div class="min-h-screen bg-gradient-to-br from-gray-100 via-orange-50 to-gray-100 flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-lg">

        <!-- Logo -->

        <div class="text-center mb-8">

            <h1 class="text-4xl font-bold text-[#c89b3c]">
                NiruStore
            </h1>

            <p class="text-gray-500 mt-2">
                Change Your Password
            </p>

        </div>

        <!-- Card -->

        <div class="bg-white rounded-3xl shadow-2xl p-8">

            <!-- Icon -->

            <div class="flex justify-center">

                <div
                    class="w-20 h-20 rounded-full bg-orange-100 flex items-center justify-center">

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-10 h-10 text-[#c89b3c]"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2h-1V7a5 5 0 00-10 0v4H6a2 2 0 00-2 2v6a2 2 0 002 2zm3-10V7a3 3 0 016 0v4H9z" />

                    </svg>

                </div>

            </div>

            <h2 class="text-3xl font-bold text-center mt-6">
                Change Password
            </h2>

            

            <!-- Success Message -->

            <div
                *ngIf="passwordChanged"
                class="bg-green-100 text-green-700 p-4 rounded-xl mt-6">

                Password updated successfully.

            </div>

            <!-- Form -->

            <form
                *ngIf="!passwordChanged"
                (ngSubmit)="changePassword()"
                class="space-y-6 mt-8">

                <!-- OLD PASSWORD -->

                <div>

                    <label class="font-medium">
                       Email
                    </label>

                    <div class="relative mt-2">

                        <input
                            [type]="showemail ? 'password' : 'text'"
                            [(ngModel)]="email"
                            name="email"
                            placeholder="Enter your email"
                            class="w-full border rounded-xl px-4 py-3 pr-12 focus:ring-2 focus:ring-[#c89b3c] outline-none">

                        <button
                            type="button"
                            (click)="showemail=!showemail"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500">

                            {{showemail ? '🙈' : '👁'}}

                        </button>

                    </div>

                    <p
                        *ngIf="emailError"
                        class="text-red-500 text-sm mt-2">

                        {{emailError}}

                    </p>

                </div>

              

                <button
                    type="submit"
                    [disabled]="loading"
                    class="w-full bg-[#c89b3c] hover:bg-[#b5852f] duration-300 text-white py-3 rounded-xl font-semibold disabled:opacity-60">

                    <span *ngIf="!loading">

                        Change Password

                    </span>

                    <span
                        *ngIf="loading"
                        class="flex items-center justify-center gap-2">

                        <svg
                            class="animate-spin h-5 w-5"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24">

                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4">
                            </circle>

                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 018-8v4l3-3-3-3v4A10 10 0 002 12h2z">
                            </path>

                        </svg>

                        Updating...

                    </span>

                </button>

            </form>

        </div>

    </div>

</div>
